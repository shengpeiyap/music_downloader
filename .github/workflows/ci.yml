name: MusicDesk CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-and-android-python:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run desktop tests
        run: python -m unittest test_app -v
      - name: Run Android Python tests
        run: python -m unittest discover -s android/app/src/test/python -v
      - name: Run batch download queue tests
        run: python tests/test_batch_queue.py
      - name: Check Android web assets match the root page
        run: python tools/sync_android_assets.py --check
      - name: Run JavaScript regression tests
        run: |
          node tests/test_android_search_fallback.js
          node tests/test_android_processing_route.js
          node tests/test_android_ui_gates.js
          node tests/test_library_sort.js
          node tests/test_friendly_message.js
          node tests/test_i18n_connection_copy.js
          node tests/test_i18n_dynamic_copy.js
          node tests/test_download_settings_gating.js

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Compile Android app and run Java unit tests
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:testDebugUnitTest
