name: Feature request
description: Propose a user problem and a possible improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected platform
      multiple: true
      options:
        - Windows desktop
        - Android
        - Browser
        - Shared behavior
    validations:
      required: true
