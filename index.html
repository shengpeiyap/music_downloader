<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicDesk · 音乐资料与格式转换</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0f0d;--panel:#151a17;--line:#29332c;--muted:#9ba89e;--green:#b8f36b;--text:#f3f6f1}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#21301d 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1000px;margin:auto;padding:52px 24px 80px}.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}h1{font-size:clamp(36px,7vw,64px);line-height:1.04;letter-spacing:-.05em;margin:24px 0 16px;max-width:750px}.intro{color:var(--muted);max-width:620px;margin:0 0 40px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 70px #0003}.card h2{margin:0 0 6px;font-size:21px}.hint{color:var(--muted);font-size:14px;margin:0 0 22px}label{font-size:13px;color:#c3cec5;display:block;margin-bottom:8px}input,select,button{font:inherit}input[type=url],select{width:100%;background:#0d110e;border:1px solid #37433a;border-radius:10px;color:var(--text);padding:13px 14px;outline:none}input:focus,select:focus{border-color:var(--green)}button{border:0;border-radius:10px;background:var(--green);color:#17200f;padding:12px 17px;font-weight:750;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:end}.row>div{flex:1}
    
    .result{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);gap:14px;align-items:center;justify-content:space-between}
    .result-info{display:flex;gap:14px;align-items:center}
    .result img{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#29332c}
    .result strong{display:block}
    .result small,.status{color:var(--muted)}
    
    .engine-box{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .engine-select{padding:6px 10px;font-size:12px;background:#151a17;border-color:#37433a;width:auto}
    .dl-btn{margin-top:0;white-space:nowrap;padding:10px 16px;font-size:14px}
    
    .source-info{font-size:12px;color:var(--green);word-break:break-all;margin-top:6px}
    .source-info a{color:var(--green);text-decoration:underline}
    
    .filebox{display:block;border:1px dashed #465449;border-radius:12px;padding:18px;background:#0d110e}.filebox input{width:100%;margin-top:10px;color:var(--muted)}.status{font-size:13px;margin:12px 0 0;min-height:20px}.legal{font-size:12px;color:#87938a;margin-top:24px}.footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:12px;color:#77847a}@media(max-width:700px){main{padding:32px 16px}.grid{grid-template-columns:1fr}.card{padding:21px}.row{display:block}.result{flex-direction:column;align-items:stretch}.engine-box{align-items:stretch}.dl-btn{margin-top:10px;width:100%}}
  </style>
</head>
<body><main>
  <div class="brand">● MusicDesk</div>
  <h1>音乐资料，<br>由你整理。</h1>
  <p class="intro">从分享链接查看公开曲目信息，或把你拥有使用权的音频转换成常见格式。轻量、私密，文件在本机处理。</p>
  <div class="grid">
    <section class="card"><h2>分享链接 · 曲目信息</h2><p class="hint">支持 Spotify 单曲与 YouTube Music / YouTube 视频链接</p>
      <form id="lookup"><label for="share">分享链接</label><input id="share" type="url" placeholder="https://open.spotify.com/track/..." required><button id="lookupBtn">读取公开信息</button></form>
      
      <div class="result" id="result">
        <div class="result-info">
          <img id="cover" alt="封面">
          <div>
            <strong id="title"></strong>
            <small id="artist"></small><br>
            <small id="provider"></small>
          </div>
        </div>
        
        <div class="engine-box">
          <select id="enginePriority" class="engine-select">
            <option value="ytdlp">首选：yt-dlp</option>
            <option value="spotdl">首选：spotdl (完整元数据)</option>
          </select>
          <button id="downloadBtn" class="dl-btn">下载 MP3</button>
        </div>
      </div>
      
      <p class="status" id="lookupStatus" aria-live="polite"></p>
      <p class="source-info" id="sourceStatus"></p>
    </section>
    
    <section class="card"><h2>转换本地音频</h2><p class="hint">转换引擎由 MusicDesk 自动准备；选择你拥有或有权处理的音频文件</p>
      <form id="convert"><label class="filebox">选择音频文件<input id="audio" type="file" accept="audio/*,.m4a,.flac,.ogg,.wav,.mp3"></label>
        <div class="row" style="margin-top:16px"><div><label for="format">导出格式</label><select id="format"><option value="mp3">MP3</option><option value="m4a">M4A / AAC</option><option value="flac">FLAC</option><option value="wav">WAV</option><option value="ogg">OGG</option></select></div><button id="convertBtn">转换并保存</button></div>
      </form><p class="status" id="convertStatus" aria-live="polite"></p>
    </section>
  </div>
  <p class="legal">分享链接用于查询平台公开提供的 metadata；支持选择 yt-dlp / spotdl 链式下载处理。</p>
  <div class="footer">MusicDesk · 在本机运行，上传的文件不会发送到外部服务。</div>
</main><script>
const $=id=>document.getElementById(id);
let currentMetadata = null;

$('lookup').addEventListener('submit',async e=>{   e.preventDefault();$('lookupBtn').disabled=true;
  $('lookupStatus').textContent='正在读取…';
  $('sourceStatus').textContent='';$('result').style.display='none';
  try{
    const r=await fetch('/api/metadata',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:$('share').value})
    });
    const d=await r.json();
    if(!r.ok)throw Error(d.error||'读取失败');
    
    currentMetadata = d;
    $('title').textContent=d.title;
    $('artist').textContent=d.artist;
    $('provider').textContent=d.provider==='spotify'?'Spotify':'YouTube Music / YouTube';$('cover').src=d.thumbnail||'';
    $('result').style.display='flex';$('lookupStatus').textContent='信息已读取。';
  }catch(err){
    $('lookupStatus').textContent=err.message;
  }finally{
    $('lookupBtn').disabled=false;
  }
});

$('downloadBtn').addEventListener('click', async ()=>{
  if(!currentMetadata) return;
  $('downloadBtn').disabled = true;
  const preferredEngine = $('enginePriority').value;
  $('lookupStatus').textContent = `正在按优先级 (${preferredEngine}) 下载并封装 MP3，请稍候...`;
  $('sourceStatus').textContent = '';
  try {
    const payload = { ...currentMetadata, preferred_engine: preferredEngine };
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok) {
      const d = await r.json();
      throw Error(d.error || '下载失败');
    }
    
    // 从响应头中提取实际抓取到的来源 URL
    const sourceUrl = r.headers.get('X-Source-Url');
    
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = decodeURIComponent((r.headers.get('Content-Disposition')||'').split("filename*=UTF-8''")[1] || `${currentMetadata.title}.mp3`);
    a.click();
    URL.revokeObjectURL(url);
    
    $('lookupStatus').textContent = '下载完成！文件已保存。';
    if (sourceUrl) {
      $('sourceStatus').innerHTML = `音频抓取来源: <a href="${sourceUrl}" target="_blank" rel="noopener">${sourceUrl}</a>`;
    }
  } catch(err) {
    $('lookupStatus').textContent = err.message;
  } finally {
    $('downloadBtn').disabled = false;
  }
});

$('convert').addEventListener('submit',async e=>{
  e.preventDefault();
  const file=$('audio').files[0];
  if(!file)return;
  if(file.size>150*1024*1024){
    $('convertStatus').textContent='文件不能超过 150 MB。';
    return;
  }
  $('convertBtn').disabled=true;
  $('convertStatus').textContent='正在本机转换…';
  try{
    const body=new FormData();
    body.append('file',file);
    body.append('format',$('format').value);
    const r=await fetch('/api/convert',{method:'POST',body});
    if(!r.ok){
      const d=await r.json();
      throw Error(d.error||'转换失败');
    }
    const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;
    a.download=decodeURIComponent((r.headers.get('Content-Disposition')||'').split("filename*=UTF-8''")[1]||'converted.'+$('format').value);
    a.click();
    URL.revokeObjectURL(url);
    $('convertStatus').textContent='转换完成，文件已保存。';
  }catch(err){
    $('convertStatus').textContent=err.message;
  }finally{
    $('convertBtn').disabled=false;
  }
});
</script></body></html>
